name: Build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -Pstandalone=true build
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - run: python3 tools/validate-demo-catalog.py
      - run: python3 tools/verify-artifacts.py
